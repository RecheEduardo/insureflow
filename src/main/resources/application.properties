spring.application.name=insureflow
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
springdoc.default-produces-media-type=application/json
scalar.enabled=true
scalar.telemetry=false
scalar.with-default-fonts=false

## Kafka Configuracao  
spring.kafka.producer.acks=all
spring.kafka.producer.compression-type=zstd
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.consumer.auto-offset-reset=earliest
insureflow.kafka.policy-events.topic=insureflow.policy.events
insureflow.kafka.policy-events.partitions=6
insureflow.kafka.policy-events.replicas=1
insureflow.kafka.policy-events.retention-ms=604800000
insureflow.kafka.policy-events.consumers-per-instance=3
insureflow.kafka.policy-events.read-model-group=insureflow-open-insurance-read-model
insureflow.kafka.policy-events.audit-group=insureflow-policy-audit
insureflow.outbox.batch-size=100
insureflow.outbox.relay-interval-ms=500

## Observabilidade
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.tracing.sampling.probability=1.0
management.observations.enable.tasks.scheduled=false
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.otlp.metrics.export.step=10s
management.otlp.metrics.export.base-time-unit=seconds
logging.structured.format.console=ecs
