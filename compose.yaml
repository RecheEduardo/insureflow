services:
  postgres:
    image: postgres:17.6-alpine
    container_name: insureflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insureflow}
      POSTGRES_USER: ${POSTGRES_USER:-insureflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insureflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - insureflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    container_name: insureflow-kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  insureflow-pgdata:
